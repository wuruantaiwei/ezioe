    <script src="/js/main/goOauth.js?v=n7gaxAdEPs-O2m-MpPLwgaYXzjkgyzEUqP12oN83Nbs"></script>

    <script>
        ComLibs.Init();
        goOauth.Init();
    </script>
    <script src="/js/pkce-utils.js?v=ocso8rExv_dzTR57pzPOlvJD5PTj9bEzyvcO8Ppc2fY"></script>
    
    <script>
        (function () {
            // Server đã build URL SSO + state (chứa nonce) cùng 1 chỗ → client chỉ ghi nonce vào
            // sessionStorage rồi follow URL. KHÔNG còn 2 nonce khác nguồn.
            var SSO_URL = "https://edu.go.vn/user?sv=ioe\u0026client_id=ioe-trang-chu\u0026redirect_uri=https%3A%2F%2Fioe.vn%2Fsso%2Fsignin-goplay\u0026skip_login=false\u0026state=eyJ1cmkiOiIvIiwic3QiOiIxNGI4MzUxN2JmYTc0MWQ5ODJkZjdkNWFlZDhjMjU2YyIsInJ0IjoibG9naW4ifQ";
            var NONCE = "14b83517bfa741d982df7d5aed8c256c";
            var RETURN_URL = "/";

            var KEYS = {
                TOKEN: '_token', RF: 'rf', UID: '_uid', NAME: 'ioe_name',
                ACCOUNT: 'ioe_account_id', EXP_AT: 'ioe_exp_at',
                NONCE: 'ioe_sso_nonce', ANON: 'ioe_sso_anonymous',
                RETURN: 'ioe_return_url',
                CODE_V: 'ioe_pkce_v'
            };

            // Xóa token cũ (user vào đây qua click "Đăng nhập" — coi như reset session)
            ['TOKEN', 'RF', 'UID', 'NAME', 'ACCOUNT', 'EXP_AT', 'ANON'].forEach(function (k) {
                try { sessionStorage.removeItem(KEYS[k]); } catch (e) {}
            });

            try {
                sessionStorage.setItem(KEYS.NONCE, NONCE);
                sessionStorage.setItem(KEYS.RETURN, RETURN_URL);
            } catch (e) {
                console.error('[SSO login] sessionStorage write failed:', e);
            }

            // PKCE — dùng PkceUtils từ pkce-utils.js (load bởi _ssoLayout), đồng bộ
            var pkce = PkceUtils.generatePkce();
            try { sessionStorage.setItem(KEYS.CODE_V, pkce.verifier); } catch (e) {}
            PkceUtils.storePkceVerifier(pkce.verifier);
            var url = PkceUtils.appendParam(SSO_URL, 'code_challenge', pkce.challenge);
            url = PkceUtils.appendParam(url, 'code_challenge_method', 'S256');
            console.log('[SSO login] nonce=', NONCE, 'pkce=yes, redirect to:', url);
            window.location.replace(url);
        })();
    </script>
